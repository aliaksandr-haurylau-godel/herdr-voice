name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-13,       target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="herdr-voice-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/herdr-voice.exe" ]; then
            cp "target/${{ matrix.target }}/release/herdr-voice.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/herdr-voice" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # macOS runners have shasum and not sha256sum; Linux and Windows
          # runners have sha256sum. scripts/install.sh makes the same choice when
          # it verifies what it fetched. The subshell keeps the archive's bare
          # name in the file rather than a dist/ prefix.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256" )
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The checkout is what puts scripts/release-kind.sh on disk here. This job
      # downloads artifacts and would otherwise have no working tree at all.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Two globs, no overlap: `*.tar.gz` cannot match a name ending
          # `.sha256`. Each archive and each sidecar appears exactly once.
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256)
          if [ "$(sh scripts/release-kind.sh "$GITHUB_REF_NAME")" = prerelease ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --title "$GITHUB_REF_NAME — install-path check" \
              --notes "Not a version of the plugin. This tag exists so the install path can be verified: the manifest's build entries fetch these archives and check them against the .sha256 files published beside them. It is deleted once that check is recorded in docs/evidence.md."
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes
          fi
