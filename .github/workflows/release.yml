name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two runs for one tag competed for the same scarce runners and both sat in the
# queue. `check.yml` has carried this for the same reason since #3; the release
# workflow never did. Keyed on the ref, so re-pointing a tag cancels the run the
# previous push started instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. `macos-13` is GitHub's Intel image and it is being withdrawn: a
          # job asking for it sat queued with no runner for seven hours while
          # the other four were given one within seconds, and the release
          # publishes only when the whole matrix has built, so that one label
          # held back five archives. Apple's toolchain builds both architectures
          # from either, and the toolchain step above installs the target.
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: audio headers (Linux)
        # cpal builds against ALSA on Linux, and alsa-sys's build script fails
        # without these headers, so neither Linux target compiles at all. The
        # same step has been in check.yml since the beginning; this workflow
        # never had it and had never been run, so the gap first appeared when
        # the v0.0.0 tag was pushed and both Linux jobs died on alsa-sys.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="herdr-voice-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/herdr-voice.exe" ]; then
            cp "target/${{ matrix.target }}/release/herdr-voice.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/herdr-voice" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # macOS runners have shasum and not sha256sum; Linux and Windows
          # runners have sha256sum. scripts/install.sh makes the same choice when
          # it verifies what it fetched. The subshell keeps the archive's bare
          # name in the file rather than a dist/ prefix.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256" )
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The checkout is what puts scripts/release-kind.sh on disk here. This job
      # downloads artifacts and would otherwise have no working tree at all.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Two globs, no overlap: `*.tar.gz` cannot match a name ending
          # `.sha256`. Each archive and each sidecar appears exactly once.
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256)
          if [ "$(sh scripts/release-kind.sh "$GITHUB_REF_NAME")" = prerelease ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --title "$GITHUB_REF_NAME — install-path check" \
              --notes "Not a version of the plugin. This tag exists so the install path can be verified: the manifest's build entries fetch these archives and check them against the .sha256 files published beside them. It is deleted once that check is recorded in docs/evidence.md."
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes
          fi
