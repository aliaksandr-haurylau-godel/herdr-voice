name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Every push to a pull request starts this twice, once per trigger, and the two
# runs compete for the same runners. Superseded runs are cancelled so a red result
# always means a real failure rather than a race with a newer commit.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A test that deadlocks would otherwise sit here for six hours. The suite runs
    # in under a minute on every platform, so anything past ten minutes is a hang,
    # and a hang should be a fast red rather than a slow one.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: audio headers (Linux)
        # cpal builds against ALSA on Linux, and without these headers nothing here
        # builds at all — not the tests, not clippy, not the format check.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        if: runner.os != 'Windows'
        run: cargo test --all
      - name: test (Windows)
        # One thread and no capture on this platform only. Named pipes are where the
        # platform differences live, and if a test hangs there the last line of
        # output names the test before it — the only way to identify the culprit
        # from a job that was killed by its timeout.
        if: runner.os == 'Windows'
        run: cargo test --all -- --test-threads=1 --nocapture

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the manifest must parse and name commands that exist
        run: python3 scripts/check_manifest.py
