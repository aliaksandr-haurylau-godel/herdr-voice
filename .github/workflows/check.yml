name: check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A test that deadlocks would otherwise sit here for six hours. The suite runs
    # in under a minute on every platform, so anything past ten minutes is a hang,
    # and a hang should be a fast red rather than a slow one.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # One thread and no capture: if a test hangs, the last line of output names
        # the test before it, which is the only way to identify the culprit from a
        # timed-out job.
        run: cargo test --all -- --test-threads=1 --nocapture

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the manifest must parse and name commands that exist
        run: python3 scripts/check_manifest.py
