[package]
name = "herdr-voice"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
description = "Voice dictation for the herdr terminal multiplexer"
license = "MIT"
repository = "https://github.com/aliaksandr-haurylau-godel/herdr-voice"
publish = false

[[bin]]
name = "herdr-voice"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
interprocess = { version = "2.4.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
