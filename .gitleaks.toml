# Leak gate, public half. Generic rules only: secrets, personal paths, internal
# hosts. Names of employers and clients are deliberately absent — a list of them
# in a public repository would itself disclose what it is meant to protect. Those
# live in an untracked file, see .leakwords.example.
title = "herdr-voice leak gate"

[extend]
useDefault = true

[[rules]]
id = "personal-home-path"
description = "Absolute home paths disclose an account name and local layout"
regex = '''/Users/[a-z0-9._%+-]+@[a-z0-9.-]+|/home/[a-z0-9._%+-]+@[a-z0-9.-]+'''
tags = ["policy", "path"]

[[rules]]
id = "internal-hosts"
description = "Internal hostnames and corporate URLs"
regex = '''(?i)https?://[a-z0-9.-]*\.(internal|corp|intranet)(/|\b)'''
tags = ["policy", "host"]

[[rules]]
id = "corporate-mail"
description = "Work email addresses"
regex = '''[a-z0-9._%+-]+@[a-z0-9.-]+\.(com|net|org)\b(?i)(?:.*(employee|internal))?'''
tags = ["policy", "mail"]

  # example.com, example.net and example.org are reserved by RFC 2606 for
  # documentation and testing; code is expected to write them without meaning a
  # real address, so a fixture like `test@example.com` is not a corporate leak.
  # Matched against each match's own span, not the whole source line: gitleaks
  # reports the rule's first capture group as the leaked secret when none is
  # named, and this rule's group 1 is only "(com|net|org)" — an allowlist keyed
  # on the source line would silently clear a real address sharing a line with
  # an example.com one, which "match" does not.
  #
  # `noreply@anthropic.com` is the no-reply address in the Co-Authored-By line
  # every commit in this repository's history already carries. It names the maker
  # of the tool, not an employer, a client or an internal system, so it is outside
  # what this rule exists to catch — and it is public in `git log` regardless. It
  # is allowlisted exactly, not as a whole domain, so a real address at that
  # domain would still be caught.
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''@example\.(com|net|org)\b''',
    '''\bnoreply@anthropic\.com\b''',
  ]
